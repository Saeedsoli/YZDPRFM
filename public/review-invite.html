<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#121212">
<title>ثبت تجربه شما — عطر یزد</title>
<!-- لینک شخصی است و نباید در نتایج جستجو بیاید -->
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/assets/theme.css">
<style>
  .ri-wrap { max-width: 640px; margin: 0 auto; padding: 26px 18px 60px }

  .ri-intro { background: linear-gradient(135deg,#141414,#242424); color:#FFF;
              border-radius: var(--r-lg); padding: 26px 20px; margin-bottom: 20px;
              overflow: hidden }
  /* در RTL، text-align روی بلوک فارسی سرریز افقی می‌سازد.
     همان درسی که در بازطراحی گرفتیم: روی فرزندان اعمال شود. */
  .ri-intro > * { text-align: center }
  .ri-intro .eyebrow { color: var(--gold); font-size:.72rem; font-weight:800;
                       letter-spacing:1.5px; display:block; margin-bottom:10px }
  .ri-intro h1 { font-size: 1.34rem; font-weight:800; line-height:1.6; margin-bottom:10px }
  .ri-intro p { font-size:.88rem; opacity:.86; line-height:2.05 }

  .ri-prod { display:flex; gap:13px; align-items:center; background:var(--surface);
             border:1px solid var(--border); border-radius:var(--r-lg);
             padding:14px; margin-bottom:18px }
  .ri-prod img { width:74px; height:74px; border-radius:10px; object-fit:cover; flex:none }
  .ri-prod .n { font-weight:800; font-size:.95rem; line-height:1.6 }
  .ri-prod .e { font-size:.78rem; color:var(--muted); margin-top:3px; direction:ltr; text-align:right }
  .ri-prod .m { font-size:.73rem; color:var(--muted); margin-top:6px }

  .ri-card { background:var(--surface); border:1px solid var(--border);
             border-radius:var(--r-lg); padding:20px }

  .ri-stars { display:flex; gap:5px; direction:rtl }
  .ri-star { background:none; border:none; cursor:pointer; padding:2px;
             font-size:2rem; line-height:1; color:#D8D2C6;
             transition: color var(--t-fast), transform var(--t-fast);
             font-family:inherit }
  .ri-star:hover { transform: scale(1.12) }
  .ri-star.on { color: var(--gold) }
  .ri-star-lbl { font-size:.8rem; color:var(--muted); margin-top:6px; min-height:1.3em }

  .ri-field { margin-top:16px }
  .ri-field label { display:block; font-size:.83rem; font-weight:700; margin-bottom:6px }
  .ri-field input, .ri-field textarea, .ri-field select {
    width:100%; padding:11px 13px; border:1.5px solid var(--border);
    border-radius:var(--r-sm); font-family:var(--font); font-size:.88rem;
    background:#FFF; color:var(--ink); line-height:1.9 }
  .ri-field textarea { resize:vertical; min-height:112px }
  .ri-field input:focus, .ri-field textarea:focus, .ri-field select:focus {
    outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(197,155,39,.13) }
  .ri-hint { font-size:.73rem; color:var(--muted); margin-top:5px; line-height:1.8 }
  .ri-err { color:#C0392B; font-size:.78rem; margin-top:5px; font-weight:700 }

  .ri-two { display:grid; grid-template-columns:1fr 1fr; gap:12px }
  @media (max-width:420px) { .ri-two { grid-template-columns:1fr } }

  .ri-state { text-align:center; padding:44px 22px }
  .ri-state svg { width:52px; height:52px; margin-bottom:14px; fill:none;
                  stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round }
  .ri-state h2 { font-size:1.12rem; font-weight:800; margin-bottom:9px; line-height:1.7 }
  .ri-state p { font-size:.88rem; color:var(--muted); line-height:2.05; max-width:420px;
                margin:0 auto }

  .ri-note { background:var(--sand); border-radius:var(--r-sm); padding:13px 15px;
             font-size:.77rem; color:var(--muted); line-height:2; margin-top:16px }

  .sk { border-radius:8px; margin-bottom:10px }
</style>
</head>
<body>
<a href="#main" class="skip-link">پرش به محتوای اصلی</a>
<!-- ارتفاع هدر از پیش رزرو می‌شود تا صفحه هنگام ساخت هدر نپرد -->
<div id="hdr" class="hdr-reserve"></div>

<main id="main">
  <div class="ri-wrap" id="root">
    <div class="ri-card">
      <div class="sk skeleton" style="height:19px;width:56%"></div>
      <div class="sk skeleton" style="height:13px;width:80%;margin-top:14px"></div>
      <div class="sk skeleton" style="height:13px;width:64%"></div>
      <div class="sk skeleton" style="height:112px;margin-top:20px"></div>
    </div>
  </div>
</main>

<div id="ftr"></div>

<script src="/assets/jalaali-core.js"></script>
<script src="/assets/app.js"></script>
<script>
document.getElementById('hdr').innerHTML = renderHeader();
document.getElementById('ftr').innerHTML = renderFooter();

const TOKEN = location.pathname.replace('/review/', '').replace(/\/$/, '');
const root = document.getElementById('root');
let product = null, picked = 0;

const IC = {
  ok:   '<circle cx="12" cy="12" r="9" stroke="#1E8449"/><path d="M8 12.5l2.6 2.6L16 9.5" stroke="#1E8449"/>',
  warn: '<circle cx="12" cy="12" r="9" stroke="#C59927"/><path d="M12 7.5v5M12 16h.01" stroke="#C59927"/>'
};

function stateBox(icon, title, text, cta) {
  return `<div class="ri-card ri-state">
    <svg viewBox="0 0 24 24">${icon}</svg>
    <h2>${title}</h2>
    <p>${text}</p>
    ${cta || ''}
  </div>`;
}

async function load() {
  let d, r;
  try {
    r = await fetch('/api/review-invite/' + encodeURIComponent(TOKEN));
    d = await r.json();
  } catch {
    root.innerHTML = stateBox(IC.warn, 'ارتباط برقرار نشد',
      'اتصال اینترنت را بررسی کنید و دوباره تلاش کنید.',
      '<button class="btn" style="margin-top:16px" onclick="location.reload()">تلاش دوباره</button>');
    return;
  }

  if (!r.ok) {
    /* لینک استفاده‌شده پیام سپاسگزارانه می‌گیرد نه پیام خطا —
       مشتری کار درست را انجام داده و نباید احساس اشتباه کند. */
    root.innerHTML = stateBox(
      d.used ? IC.ok : IC.warn,
      d.used ? 'نظر شما ثبت شده است' : 'این لینک دیگر فعال نیست',
      esc(d.error || 'لینک معتبر نیست.'),
      '<a href="/" class="btn btn-outline" style="margin-top:16px;display:inline-block">مشاهده کاتالوگ عطرها</a>');
    return;
  }

  product = d.product;
  render(d);
}

function render(d) {
  const p = d.product;
  const full = p.brand_fa ? `${p.brand_fa} — ${p.name_fa}` : p.name_fa;

  root.innerHTML = `
    <div class="ri-intro">
      <span class="eyebrow">عطر یزد</span>
      <h1>تجربه‌تان را بنویسید</h1>
      <p>شما این رایحه را از ما گرفته‌اید. نظر شما به کسی که هنوز
         تصمیم نگرفته کمک می‌کند — صادقانه بنویسید، حتی اگر انتقاد باشد.</p>
    </div>

    <div class="ri-prod">
      <img src="${cardImage(p.image_url)}" alt="${isGenericProductImage(p.image_url) ? 'تصویر نمادین' : 'تصویر'} ${esc(full)}" width="74" height="74">
      <div>
        <div class="n">${esc(full)}</div>
        <div class="e">${esc(p.name_en || '')}</div>
        ${isGenericProductImage(p.image_url) ? '<div class="m">تصویر نمادین است</div>' : ''}
        <div class="m">دعوت‌نامه برای <bdi>${toFa(esc(d.mobile_masked))}</bdi></div>
      </div>
    </div>

    <div class="ri-card">
      <div>
        <div style="font-size:.83rem;font-weight:700;margin-bottom:7px">امتیاز کلی شما *</div>
        <div class="ri-stars" id="stars" role="group" aria-label="انتخاب امتیاز از ۱ تا ۵">
          ${[1,2,3,4,5].map(n => `<button type="button" class="ri-star" data-n="${n}"
             onclick="pick(${n})" aria-label="${toFa(n)} ستاره">★</button>`).join('')}
        </div>
        <div class="ri-star-lbl" id="starLbl"></div>
        <div id="errRating"></div>
      </div>

      <div class="ri-field">
        <label for="rName">نامی که زیر نظر نمایش داده شود</label>
        <input id="rName" maxlength="40" placeholder="مثلاً: رضا م.">
        <div class="ri-hint">خالی بگذارید تا شماره‌تان به‌صورت ماسک‌شده نمایش داده شود.</div>
      </div>

      <div class="ri-field">
        <label for="rTitle">عنوان کوتاه</label>
        <input id="rTitle" maxlength="120" placeholder="مثلاً: ماندگاری بهتر از انتظارم بود">
      </div>

      <div class="ri-field">
        <label for="rBody">تجربه شما *</label>
        <textarea id="rBody" maxlength="2000" rows="5"
          placeholder="چه زمانی استفاده کردید؟ چقدر ماند؟ اطرافیان چه گفتند؟"></textarea>
        <div class="ri-hint">حداقل ۱۰ حرف. <span id="cnt"></span></div>
        <div id="errBody"></div>
      </div>

      <div class="ri-two">
        <div class="ri-field" style="margin-top:6px">
          <label for="rLong">ماندگاری</label>
          <select id="rLong"><option value="">انتخاب…</option>
            ${[1,2,3,4,5].map(n => `<option value="${n}">${toFa(n)} از ۵</option>`).join('')}</select>
        </div>
        <div class="ri-field" style="margin-top:6px">
          <label for="rSill">پخش بو</label>
          <select id="rSill"><option value="">انتخاب…</option>
            ${[1,2,3,4,5].map(n => `<option value="${n}">${toFa(n)} از ۵</option>`).join('')}</select>
        </div>
      </div>

      <button class="btn btn-block" style="margin-top:20px" id="sendBtn"
        onclick="submit()">ثبت نظر</button>

      <div class="ri-note">
        نظر شما پس از بررسی منتشر می‌شود. ما نظر منفی را حذف نمی‌کنیم —
        فقط توهین و تبلیغ را. شماره تماس شما هرگز نمایش داده نمی‌شود.
      </div>
    </div>`;

  const body = document.getElementById('rBody');
  /* شمارنده حرف زنده — کاربر نباید بعد از نوشتن و زدن دکمه بفهمد
     متنش کوتاه بوده. رنگ هم عوض می‌شود تا با یک نگاه معلوم باشد. */
  const cnt = document.getElementById('cnt');
  const upd = () => {
    const n = body.value.trim().length;
    cnt.textContent = n ? `(${toFa(n)} حرف)` : '';
    cnt.style.color = n && n < 10 ? '#C0392B' : 'var(--muted)';
  };
  body.addEventListener('input', upd);
  upd();
}

const LBL = ['', 'اصلاً راضی نبودم', 'انتظار بیشتری داشتم',
             'قابل قبول بود', 'راضی بودم', 'عالی بود'];

function pick(n) {
  picked = n;
  document.querySelectorAll('.ri-star').forEach(b =>
    b.classList.toggle('on', +b.dataset.n <= n));
  document.getElementById('starLbl').textContent = LBL[n];
  document.getElementById('errRating').innerHTML = '';
}

async function submit() {
  const btn = document.getElementById('sendBtn');
  const body = document.getElementById('rBody').value.trim();
  let bad = false;

  /* خطا کنار خود فیلد نشان داده می‌شود، نه بالای صفحه — روی موبایل
     کاربر نباید اسکرول کند تا بفهمد کجا ایراد دارد. */
  document.getElementById('errRating').innerHTML = picked
    ? '' : '<div class="ri-err">امتیاز را انتخاب کنید.</div>';
  if (!picked) bad = true;

  document.getElementById('errBody').innerHTML = body.length >= 10
    ? '' : '<div class="ri-err">متن نظر باید حداقل ۱۰ حرف باشد.</div>';
  if (body.length < 10) bad = true;

  if (bad) return;

  btn.disabled = true;
  btn.textContent = 'در حال ثبت…';

  try {
    const r = await fetch('/api/review-invite', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        token: TOKEN,
        rating: picked,
        display_name: document.getElementById('rName').value.trim() || undefined,
        title: document.getElementById('rTitle').value.trim() || undefined,
        body,
        longevity: document.getElementById('rLong').value || undefined,
        sillage: document.getElementById('rSill').value || undefined
      })
    });
    const d = await r.json();

    if (!r.ok) {
      btn.disabled = false;
      btn.textContent = 'ثبت نظر';
      document.getElementById('errBody').innerHTML =
        `<div class="ri-err">${esc(d.error || 'ثبت نظر انجام نشد.')}</div>`;
      return;
    }

    root.innerHTML = stateBox(IC.ok, 'سپاسگزاریم',
      esc(d.message),
      `<a href="/perfume/${product.slug}" class="btn btn-outline"
         style="margin-top:16px;display:inline-block">مشاهده صفحه این عطر</a>`);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch {
    btn.disabled = false;
    btn.textContent = 'ثبت نظر';
    document.getElementById('errBody').innerHTML =
      '<div class="ri-err">ارتباط با سرور برقرار نشد. دوباره تلاش کنید.</div>';
  }
}

load();
</script>
</body>
</html>
