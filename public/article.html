<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#121212">
<title>مقاله | مجله عطر یزد</title>
<meta name="description" content="مقاله آموزشی از مجله عطر یزد">
<!-- فونت عمداً preload نمی‌شود.
     با font-display:swap متن بلافاصله با فونت سیستمی دیده می‌شود،
     پس preload فقط پهنای باند را از تصویر اصلی می‌دزدد. روی ۳G
     اندازه‌گیری شد: حذف آن LCP صفحه محصول را از ۴٫۳۱s به ۳٫۵۷s
     رساند بدون آنکه FCP بدتر شود. -->
<link rel="stylesheet" href="/assets/theme.css">
<style>
  /* قاب تصویر شاخص با عنوان روی آن */
  .art-hero { position: relative; max-width: 1060px; margin: 22px auto 0; padding: 0 20px }
  .art-figure {
    position: relative; border-radius: var(--r-lg); overflow: hidden;
    animation: fadeUp 700ms var(--ease-out) backwards;
  }
  .art-figure img {
    width: 100%; aspect-ratio: 16/7; object-fit: cover; display: block;
    animation: heroDrift 22s ease-in-out infinite alternate;
  }
  .art-figure::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(12,12,12,.82) 0%, rgba(12,12,12,.28) 45%, transparent 75%);
  }
  .art-figure .cap {
    position: absolute; right: 0; left: 0; bottom: 0; z-index: 2;
    padding: var(--sp-6) var(--sp-5); color: #FFF;
  }
  .art-figure .cap h1 {
    font-size: clamp(1.35rem, 3.6vw, 2.05rem); font-weight: 800;
    line-height: 1.45; letter-spacing: -.02em; max-width: 760px;
    animation: headRise 820ms var(--ease-out) 220ms backwards;
  }
  @media (max-width: 640px) {
    .art-figure img { aspect-ratio: 4/3 }
    .art-figure .cap { padding: var(--sp-5) 18px }
  }

  .art-meta {
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    font-size: .74rem; font-weight: 700; margin-bottom: 12px;
    animation: fadeUp 700ms var(--ease-out) 120ms backwards;
  }
  .art-meta .tag {
    background: rgba(197,155,39,.18); border: 1px solid rgba(197,155,39,.45);
    color: #EBD9A6; border-radius: 30px; padding: 5px 13px; letter-spacing: .4px;
  }
  .art-meta .dot { opacity: .5 }
  .art-meta .t { color: rgba(255,255,255,.7); font-weight: 400 }

  .art-body { max-width: 720px; margin: 0 auto; padding: var(--sp-6) 20px 0 }
  .art-body > * { animation: fadeUp 560ms var(--ease-out) backwards }
  .art-body > *:nth-child(2){animation-delay:90ms}
  .art-body > *:nth-child(3){animation-delay:170ms}

  .excerpt {
    font-size: 1.02rem; color: #3A3A3A; line-height: 2.15; font-weight: 500;
    padding: 16px 18px 16px 16px; background: var(--sand);
    border-right: 3px solid var(--gold); border-radius: 12px;
    margin-bottom: var(--sp-6);
  }
  /* pre-wrap دیگر لازم نیست — متن حالا با <p> و <h2> ساختار دارد */
  .content { font-size: 1.02rem; line-height: 2.5; color: #2A2A2A }
  .content p { margin: 0 0 20px }
  .content h2 {
    font-size: 1.18rem; font-weight: 800; color: var(--ink);
    margin: 34px 0 12px; line-height: 1.75;
    padding-right: 14px; position: relative;
  }
  /* خط طلایی کنار عنوان — نشانه بصری برند */
  .content h2::before {
    content: ''; position: absolute; right: 0; top: .38em;
    width: 3px; height: 1.05em; border-radius: 2px; background: var(--gold);
  }
  .content h2:first-child { margin-top: 0 }

  /* حرف اول بزرگ — روی نخستین پاراگراف، نه روی عنوان */
  .content > p:first-of-type::first-letter {
    float: right; font-size: 3.1rem; line-height: .96; font-weight: 800;
    color: var(--gold); margin: 6px 0 0 10px;
  }

  .art-share {
    display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
    max-width: 720px; margin: var(--sp-6) auto 0; padding: var(--sp-5) 20px 0;
    border-top: 1px dashed var(--border);
  }
  .art-share .lbl { font-size: .8rem; color: var(--muted); margin-left: 4px }
  .sh {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    border-radius: 30px; padding: 8px 15px; font: inherit; font-size: .79rem; font-weight: 700;
    transition: all var(--t-fast);
  }
  .sh:hover { border-color: var(--gold); color: var(--gold); transform: translateY(-2px) }
  .sh svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2 }

  .art-nav { max-width: 720px; margin: var(--sp-5) auto 0; padding: 0 20px }
  .back { font-size: .86rem; color: var(--muted); transition: color var(--t-fast) }
  .back:hover { color: var(--gold) }

  .more { max-width: 1060px; margin: var(--sp-7) auto; padding: 0 20px }
  .more-head { display: flex; align-items: center; gap: 12px; margin-bottom: var(--sp-5) }
  .more-head h2 { font-size: 1.14rem; font-weight: 800; white-space: nowrap }
  .more-head::after { content: ''; flex: 1; height: 1px; background: var(--border) }
  .more-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(250px,1fr)); gap: 16px }
  .more-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r); overflow: hidden; display: block;
    transition: transform var(--t-smooth), box-shadow var(--t-smooth), border-color var(--t-fast);
  }
  .more-card:hover { border-color: rgba(197,155,39,.45); transform: translateY(-4px); box-shadow: var(--sh-lg) }
  .more-card .im { overflow: hidden; aspect-ratio: 16/9 }
  .more-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 700ms var(--ease-out) }
  .more-card:hover img { transform: scale(1.07) }
  .more-card .b { padding: 14px }
  .more-card .t { font-size: .92rem; font-weight: 800; line-height: 1.65 }
  .more-card .c { font-size: .72rem; color: var(--gold); font-weight: 700; margin-top: 6px }
</style>
</head>
<body>
<a href="#main" class="skip-link">پرش به محتوای اصلی</a>
<!-- ارتفاع هدر از پیش رزرو می‌شود. هدر با جاوااسکریپت از app.js
     ساخته می‌شود، پس تا آن لحظه ارتفاعش صفر است و با ظاهر شدن،
     کل صفحه ۹۷ تا ۱۰۳ پیکسل پایین می‌پرد. ردیابی نشان داد این
     تک‌ریشهٔ جابه‌جایی در همه صفحات بود (MAIN#main: y 0 → 97).
     اندازه‌گیری واقعی: موبایل ۹۷px · دسکتاپ ۱۰۳px. -->
<div id="hdr" class="hdr-reserve"></div>

<main id="main" data-progress>
  <div id="loading" role="status"><div class="spinner"></div></div>
  <article id="content" style="display:none">
    <div class="art-hero">
      <figure class="art-figure">
        <img id="cover" alt="" loading="eager">
        <figcaption class="cap">
          <div class="art-meta" id="meta"></div>
          <h1 id="title"></h1>
        </figcaption>
      </figure>
    </div>
    <div class="art-body">
      <div class="excerpt" id="excerpt"></div>
      <div class="content" id="body"></div>
    </div>
    <div class="art-share">
      <span class="lbl">این مطلب مفید بود؟ به دیگران هم برسانید</span>
      <button class="sh" onclick="shareTo('tg')">
        <svg viewBox="0 0 24 24"><path d="M21 4L3 11l5 2 2 6 3-4 5 4z"/></svg> تلگرام</button>
      <button class="sh" onclick="shareTo('wa')">
        <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 01-11.6 7.1L4 20l1-4.2A8 8 0 1120 12z"/></svg> واتساپ</button>
      <button class="sh" id="copyBtn" onclick="copyLink()">
        <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 007 0l2-2a5 5 0 00-7-7l-1 1"/><path d="M14 11a5 5 0 00-7 0l-2 2a5 5 0 007 7l1-1"/></svg>
        کپی لینک</button>
    </div>
    <div class="art-nav"><a href="/journal" class="back">← بازگشت به مجله</a></div>
  </article>
  <section class="more reveal" id="moreBox" style="display:none">
    <div class="more-head"><h2>مطالب دیگر</h2></div>
    <div class="more-grid stagger" id="more"></div>
  </section>
</main>

<div id="ftr"></div>

<script src="/assets/app.js"></script>
<script>
document.getElementById('hdr').innerHTML = renderHeader('journal');
document.getElementById('ftr').innerHTML = renderFooter();

const COVERS = {
  notes: '/images/products/family-citrus.jpg',
  guide: '/images/products/scene-signature.jpg',
  video: '/images/products/family-ambery-oriental.jpg'
};
const cover = a => (a.cover_image && a.cover_image.startsWith('/images/products'))
  ? a.cover_image : (COVERS[a.category] || COVERS.guide);

const slug = location.pathname.replace('/journal/', '').replace(/\/$/, '');

/**
 * تبدیل متن ساده مقاله به HTML ساختاریافته.
 *
 * مقالات به‌صورت متن ساده ذخیره می‌شوند و پیش‌تر با `textContent`
 * و `white-space: pre-wrap` چاپ می‌شدند. نتیجه یک توده متن بود:
 * «بوی وتیور را چطور توصیف کنیم؟» که یک پرسش کلیدی است، دقیقاً
 * شبیه بقیه متن دیده می‌شد.
 *
 * دو زیان داشت:
 *   ۱) خواننده نمی‌توانست مقاله را اسکن کند
 *   ۲) گوگل ساختار مقاله را نمی‌فهمید — هیچ <h2> در صفحه نبود
 *
 * قاعده تشخیص عنوان (بدون تغییر محتوای موجود):
 *   خطی که کوتاه است، تنها در پاراگراف خودش آمده، و با «؟» تمام
 *   می‌شود یا نقطه ندارد → عنوان فرعی.
 *
 * امنیت: چون خروجی با innerHTML چاپ می‌شود، هر پاره متن پیش از
 * ترکیب از esc() عبور می‌کند. محتوای مقاله را کارمند با مجوز
 * content.write می‌نویسد، ولی به آن هم تکیه نمی‌کنیم.
 */
function renderArticle(text) {
  const blocks = String(text).split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);

  return blocks.map(block => {
    const lines = block.split('\n').map(l => l.trim()).filter(Boolean);

    // پاراگراف چندخطی که خط اولش عنوان است
    if (lines.length > 1 && isHeading(lines[0])) {
      const head = `<h2>${esc(lines[0])}</h2>`;
      const rest = lines.slice(1).join(' ');
      return head + `<p>${esc(rest)}</p>`;
    }

    // بلوک تک‌خطی که عنوان است
    if (lines.length === 1 && isHeading(lines[0])) {
      return `<h2>${esc(lines[0])}</h2>`;
    }

    return `<p>${esc(lines.join(' '))}</p>`;
  }).join('');
}

/** آیا این خط عنوان فرعی است؟ */
function isHeading(line) {
  if (line.length > 70) return false;           // جمله بلند، عنوان نیست
  if (line.endsWith('؟')) return true;          // پرسش کلیدی
  // خط کوتاه بدون نقطه پایانی — مثل «نکته کاربردی»
  return line.length <= 40 && !/[.!،؛:]$/.test(line);
}

async function load() {
  try {
    const r = await fetch('/api/articles/' + encodeURIComponent(slug));
    if (!r.ok) throw 0;
    const a = await r.json();

    document.title = a.title + ' | مجله عطر یزد';
    document.getElementById('cover').src = cover(a);
    document.getElementById('cover').alt = a.title;
    document.getElementById('meta').innerHTML =
      `<span class="tag">${esc(a.category_label || 'مقاله')}</span>` +
      (a.read_time ? `<span class="dot">·</span><span class="t">${a.read_time} مطالعه</span>` : '');
    document.getElementById('title').textContent = a.title;
    document.getElementById('excerpt').textContent = a.excerpt || '';
    document.getElementById('body').innerHTML = renderArticle(a.content || '');

    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';
    loadMore(a.id);
  } catch {
    document.getElementById('loading').innerHTML =
      `<div class="empty-state"><h3>مقاله یافت نشد</h3>
       <a href="/journal" class="btn" style="margin-top:16px;display:inline-block">
       بازگشت به مجله</a></div>`;
  }
}

async function loadMore(currentId) {
  const d = await fetch('/api/articles').then(r => r.json());
  const list = (d.articles || []).filter(x => x.id !== currentId).slice(0, 3);
  if (!list.length) return;
  document.getElementById('moreBox').style.display = 'block';
  document.getElementById('more').innerHTML = list.map(a => `
    <a class="more-card" href="/journal/${esc(a.slug)}">
      <div class="im"><img src="${cover(a)}" alt="" loading="lazy"></div>
      <div class="b"><div class="t">${esc(a.title)}</div>
        <div class="c">${esc(a.category_label || 'مقاله')}${a.read_time ? `<span class="sep"></span>${esc(a.read_time)}` : ''}</div></div>
    </a>`).join('');
}

function shareTo(k) {
  const u = encodeURIComponent(location.href);
  const t = encodeURIComponent(document.getElementById('title').textContent || 'مجله عطر یزد');
  const map = {
    tg: `https://t.me/share/url?url=${u}&text=${t}`,
    wa: `https://wa.me/?text=${t}%20${u}`
  };
  window.open(map[k], '_blank', 'noopener');
}
function copyLink() {
  const b = document.getElementById('copyBtn');
  navigator.clipboard.writeText(location.href).then(() => {
    const old = b.innerHTML;
    b.innerHTML = '<svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg> کپی شد';
    b.style.borderColor = 'var(--gold)'; b.style.color = 'var(--gold)';
    setTimeout(() => { b.innerHTML = old; b.style.borderColor = ''; b.style.color = ''; }, 1900);
  }).catch(() => {});
}

load();
</script>
</body>
</html>
