<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#121212">
<title>مجله آموزشی | عطر یزد</title>
<meta name="description" content="مجله آموزشی عطر یزد — دانشنامه نُت‌های بویایی، راهنمای انتخاب رایحه و آموزش نگهداری عطر.">
<!-- فونت عمداً preload نمی‌شود.
     با font-display:swap متن بلافاصله با فونت سیستمی دیده می‌شود،
     پس preload فقط پهنای باند را از تصویر اصلی می‌دزدد. روی ۳G
     اندازه‌گیری شد: حذف آن LCP صفحه محصول را از ۴٫۳۱s به ۳٫۵۷s
     رساند بدون آنکه FCP بدتر شود. -->
<link rel="stylesheet" href="/assets/theme.css">
<style>
  .j-hero { background: linear-gradient(135deg,#141414,#232323); color:#FFF;
            padding: 46px 20px; text-align: center; }
  .j-hero h1 { font-size: 1.7rem; font-weight: 800; margin-bottom: 8px; }
  .j-hero h1 span { color: var(--gold); }
  .j-hero p { font-size: .9rem; opacity: .78; max-width: 620px; margin: 0 auto; line-height: 1.9; }

  .cats { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 24px 0; }
  .cat { padding: 8px 18px; border-radius: 22px; border: 1px solid var(--border);
         background: var(--surface); cursor: pointer; font-size: .84rem; font-weight: 700;
         transition: all var(--t-fast); }
  .cat:hover { border-color: var(--gold); }
  .cat.on { background: var(--obsidian); color: var(--gold); border-color: var(--obsidian); }

  .j-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 20px; }

  /* فضای گرید پیش از رسیدن مقالات رزرو می‌شود.
     بدون آن، گرید از ارتفاع صفر به ارتفاع کامل می‌پرید و فوتر
     به پایین پرتاب می‌شد — بنچمارک CLS=۰٫۴۳ روی موبایل نشان داد.
     پس از پر شدن، کلاس is-ready رزرو را برمی‌دارد تا اگر مقالات
     کم بودند فضای خالی نماند. */
  /* اندازه‌گیری شد: گرید مقالات روی موبایل ~۱۶۰۰px و روی دسکتاپ
     ~۹۰۰px است. رزرو بیش از حد هم بد است — وقتی برداشته شود
     صفحه جمع می‌شود و همان جابه‌جایی را می‌سازد. */
  /* اندازه‌گیری واقعی: گرید موبایل ۱۹۱vh · دسکتاپ ۵۲vh */
  .j-grid:not(.is-ready) { min-height: 52vh; }
  @media (max-width: 860px) { .j-grid:not(.is-ready) { min-height: 191vh } }
  .j-card { background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column;
            transition: transform var(--t-smooth), box-shadow var(--t-smooth); cursor: pointer; }
  .j-card:hover { transform: translateY(-4px); box-shadow: var(--shadow); border-color: var(--gold); }
  .j-card .cover { aspect-ratio: 16/9; overflow: hidden; background: var(--sand); }
  .j-card .cover img { width:100%; height:100%; object-fit: cover;
                       transition: transform 600ms cubic-bezier(.16,1,.3,1); }
  .j-card:hover .cover img { transform: scale(1.05); }
  .j-card .body { padding: 16px; display: flex; flex-direction: column; flex: 1; }
  .j-meta { display: flex; justify-content: space-between; font-size: .72rem;
            color: var(--gold); font-weight: 700; margin-bottom: 7px; }
  .j-title { font-size: 1rem; font-weight: 800; line-height: 1.6; margin-bottom: 7px; }
  .j-ex { font-size: .82rem; color: var(--muted); line-height: 1.9; flex: 1; }
  .j-more { font-size: .78rem; color: var(--gold); font-weight: 700; margin-top: 12px; }

  /* ── مقاله شاخص: تازه‌ترین مطلب، تمام‌عرض ── */
  .feature {
    display: grid; grid-template-columns: 1.15fr 1fr; gap: 0;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r-lg); overflow: hidden; margin-bottom: var(--sp-6);
    text-decoration: none; color: inherit;
    transition: transform var(--t-smooth), box-shadow var(--t-smooth), border-color var(--t-fast);
    animation: fadeUp 620ms var(--ease-out) backwards;
  }
  .feature:hover { transform: translateY(-3px); box-shadow: var(--sh-lg);
                   border-color: rgba(197,155,39,.45) }
  .feature .im { position: relative; overflow: hidden; min-height: 260px }
  /* picture هم باید کل قاب را پر کند — تصویر شاخص داخل <picture>
     است تا با نسخه WebP هماهنگ شود. بدون این قاعده، ارتفاع صفر
     می‌گیرد و تصویر ناپدید می‌شود. */
  .feature .im picture { display: block; width: 100%; height: 100% }
  .feature .im img { width: 100%; height: 100%; object-fit: cover; display: block;
                     transition: transform 800ms var(--ease-out) }
  .feature:hover .im img { transform: scale(1.05) }
  .feature .tag-new {
    position: absolute; top: 14px; right: 14px; z-index: 2;
    background: var(--gold); color: #121212; font-size: .7rem; font-weight: 800;
    padding: 5px 13px; border-radius: 30px; letter-spacing: .4px;
    animation: badgePop 460ms var(--ease-spring) 300ms backwards;
  }
  .feature .bd { padding: var(--sp-6) var(--sp-5); display: flex;
                 flex-direction: column; justify-content: center }
  .feature .k { font-size: .7rem; font-weight: 700; letter-spacing: 2px;
                color: var(--gold); margin-bottom: 10px }
  .feature h2 { font-size: clamp(1.2rem,2.4vw,1.6rem); font-weight: 800;
                line-height: 1.5; letter-spacing: -.015em; margin-bottom: 10px }
  .feature p { font-size: .89rem; line-height: 2.1; color: var(--muted) }
  .feature .go { font-size: .82rem; color: var(--gold); font-weight: 700; margin-top: 16px }
  @media (max-width: 780px) {
    .feature { grid-template-columns: 1fr }
    .feature .im { min-height: 0; aspect-ratio: 16/9 }
  }

  /* ── جستجو در مطالب ── */
  .j-search { position: relative; max-width: 400px; margin: 0 auto var(--sp-5) }
  .j-search input {
    width: 100%; padding: 13px 44px 13px 18px; border: 1px solid var(--border);
    border-radius: 40px; background: var(--surface); font: inherit; font-size: .88rem;
    transition: border-color var(--t-fast), box-shadow var(--t-fast);
  }
  .j-search input:focus { outline: none; border-color: var(--gold);
    box-shadow: 0 0 0 4px rgba(197,155,39,.12) }
  .j-search svg { position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
    width: 17px; height: 17px; stroke: var(--muted); fill: none; stroke-width: 2 }

  .cat .n { font-size: .7rem; opacity: .6; margin-right: 3px }
  .j-count { text-align: center; font-size: .78rem; color: var(--muted);
             margin-bottom: var(--sp-4) }

</style>
</head>
<body>
<a href="#main" class="skip-link">پرش به محتوای اصلی</a>
<!-- ارتفاع هدر از پیش رزرو می‌شود. هدر با جاوااسکریپت از app.js
     ساخته می‌شود، پس تا آن لحظه ارتفاعش صفر است و با ظاهر شدن،
     کل صفحه ۹۷ تا ۱۰۳ پیکسل پایین می‌پرد. ردیابی نشان داد این
     تک‌ریشهٔ جابه‌جایی در همه صفحات بود (MAIN#main: y 0 → 97).
     اندازه‌گیری واقعی: موبایل ۹۷px · دسکتاپ ۱۰۳px. -->
<div id="hdr" class="hdr-reserve"></div>

<div id="listView">
  <section class="page-head">
    <div class="inner">
      <span class="eyebrow">دانشنامه رایحه</span>
      <h1>مجله آموزشی <em>عطر یزد</em></h1>
      <p>شناخت نُت‌های بویایی، راهنمای انتخاب رایحه متناسب با شخصیت،
         و آموزش نگهداری درست عطر — به زبان ساده.</p>
    </div>
  </section>

  <main id="main" class="container">
    <!-- کارت شاخص با جاوااسکریپت ساخته می‌شود؛ تا آن لحظه فضایش
         خالی است و بقیه صفحه بالا می‌ماند. ردیابی نشان داد بزرگ‌ترین
         جابه‌جایی صفحه مجله از همین‌جا می‌آمد. -->
    <div id="feature" style="min-height:54vh"></div>

    <div class="j-search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="jq" placeholder="جستجو در مطالب…" aria-label="جستجو در مقالات">
    </div>

    <div class="cats" id="cats"></div>
    <div class="j-count" id="jcount"></div>
    <div class="j-grid stagger" id="grid" style="min-height:52vh"></div>
    <div id="loading" role="status"><div class="spinner"></div></div>
  </main>
</div>

<div id="ftr"></div>

<script src="/assets/jalaali-core.js"></script>
<script src="/assets/app.js"></script>
<script>
document.getElementById('hdr').innerHTML = renderHeader('journal');
document.getElementById('ftr').innerHTML = renderFooter();

const CATS = [
  { k: 'all',   t: 'همه مطالب' },
  { k: 'guide', t: 'راهنمای خرید' },
  { k: 'notes', t: 'دانشنامه نُت‌ها' },
  { k: 'video', t: 'ویدیوهای آموزشی' }
];
const COVERS = {
  notes: '/images/products/family-citrus.jpg',
  guide: '/images/products/scene-signature.jpg',
  video: '/images/products/family-ambery-oriental.jpg'
};

let articles = [], activeCat = 'all', query = '';

const coverOf = a => (a.cover_image && a.cover_image.startsWith('/images/products'))
  ? a.cover_image : (COVERS[a.category] || COVERS.guide);

/* دسته‌ها با تعداد واقعی — دسته خالی اصلاً نمایش داده نمی‌شود */
function drawCats() {
  const box = document.getElementById('cats');
  box.innerHTML = CATS
    .map(c => ({ ...c, n: c.k === 'all' ? articles.length
                        : articles.filter(a => a.category === c.k).length }))
    .filter(c => c.n > 0)
    .map(c => `<div class="cat ${c.k === activeCat ? 'on' : ''}" data-k="${c.k}">
        ${c.t}<span class="n">${toFa(c.n)}</span></div>`).join('');

  box.querySelectorAll('.cat').forEach(c => c.onclick = () => {
    activeCat = c.dataset.k;
    box.querySelectorAll('.cat').forEach(x => x.classList.toggle('on', x === c));
    draw();
  });
}

/* تازه‌ترین مطلب بالای صفحه — بدون آن، همه کارت‌ها هم‌وزن‌اند
   و خواننده نمی‌داند از کجا شروع کند */
function drawFeature() {
  const a = articles[0];
  const box = document.getElementById('feature');
  if (!a || activeCat !== 'all' || query) { box.innerHTML = ''; return; }

  /* ── چرا این شرط ──
     سرور همین بلوک را از پیش در HTML گذاشته تا تصویر بدون
     انتظار برای جاوااسکریپت رندر شود (LCP). اگر اینجا دوباره
     بسازیمش، مرورگر تگ `<img>` را دور می‌اندازد و از نو
     می‌سازد — تصویری که آماده بود یک لحظه ناپدید می‌شود و
     LCP دوباره به تعویق می‌افتد.

     پس اگر همان مقاله از قبل رندر شده، دست نمی‌زنیم.
     `data-slug` را سرور می‌گذارد. */
  if (box.dataset.slug === a.slug) return;

  box.innerHTML = `
    <a class="feature" href="/journal/${esc(a.slug)}">
      <div class="im">
        <span class="tag-new">تازه‌ترین</span>
        <!-- تصویر شاخص همان عنصر LCP صفحه است. نسخه WebP حدود ۶۰٪
             سبک‌تر است و روی ۳G تفاوتش چند ثانیه می‌شود. -->
        <picture>
          <source srcset="${coverOf(a).replace(/\.(jpe?g|png)$/i, '.webp')}" type="image/webp">
          <img src="${coverOf(a)}" alt="" fetchpriority="high" decoding="async">
        </picture>
      </div>
      <div class="bd">
        <div class="k">${esc(a.category_label || 'مقاله')}${a.read_time ? `<span class="sep"></span>${esc(a.read_time)}` : ''}</div>
        <h2>${esc(a.title)}</h2>
        <p>${esc((a.excerpt || '').replace(/\s+/g, ' ').trim().slice(0, 165))}</p>
        <div class="go">خواندن مطلب ←</div>
      </div>
    </a>`;
  box.dataset.slug = a.slug;
}

document.getElementById('jq').oninput = e => {
  query = e.target.value.trim().toLowerCase();
  drawFeature();
  draw();
};

async function load() {
  try {
    const r = await fetch('/api/articles');
    if (!r.ok) throw new Error();
    const d = await r.json();
    articles = d.articles || [];
    document.getElementById('loading').style.display = 'none';
    drawCats();
    drawFeature();
    draw();
    // رزرو ارتفاع برداشته می‌شود؛ از اینجا به بعد خود مقالات
    // ارتفاع را تعیین می‌کنند
    // سبک درون‌خطی هم برداشته می‌شود، وگرنه رزرو ارتفاع باقی
    // می‌ماند و زیر مقالات فضای خالی می‌افتد
    const gEl = document.getElementById('grid');
    gEl.style.minHeight = '';
    gEl.classList.add('is-ready');
    document.getElementById('feature').style.minHeight = '';
  } catch {
    document.getElementById('loading').innerHTML =
      `<div class="empty-state"><h3>ارتباط برقرار نشد</h3>
       <p>اتصال اینترنت خود را بررسی کنید.</p>
       <button class="btn" style="margin-top:14px" onclick="location.reload()">تلاش دوباره</button></div>`;
  }
}

function draw() {
  let list = activeCat === 'all' ? articles : articles.filter(a => a.category === activeCat);

  if (query) {
    list = list.filter(a =>
      (a.title || '').toLowerCase().includes(query) ||
      (a.excerpt || '').toLowerCase().includes(query) ||
      (a.content || '').toLowerCase().includes(query));
  }

  // مقاله شاخص در شبکه تکرار نشود
  if (!query && activeCat === 'all' && list.length > 1) list = list.slice(1);

  const g = document.getElementById('grid');
  const cnt = document.getElementById('jcount');

  cnt.textContent = query
    ? (list.length ? `${toFa(list.length)} مطلب پیدا شد` : '')
    : '';

  if (!list.length) {
    g.innerHTML = `<div class="empty-state soft-card" style="grid-column:1/-1;padding:44px 24px">
      <h3>${query ? 'مطلبی پیدا نشد' : 'مطلبی در این دسته نیست'}</h3>
      <p style="margin-top:8px;font-size:.87rem;color:var(--muted);line-height:2">
        ${query ? 'عبارت دیگری را امتحان کنید یا همه مطالب را ببینید.'
                : 'به‌زودی مطالب این بخش اضافه می‌شود.'}</p>
      ${query ? `<button class="btn btn-outline" style="margin-top:16px"
        onclick="clearSearch()">پاک کردن جستجو</button>` : ''}
    </div>`;
    return;
  }

  g.innerHTML = list.map(a => `
    <a class="j-card" href="/journal/${esc(a.slug)}" style="text-decoration:none;color:inherit">
      <!-- کارت‌ها حدود ۲۸۰ پیکسل عرض دارند؛ فایل کامل ۱۲۵۴ پیکسلی
           برایشان اسراف است. پنج کارت با هم ~۱۸۵KB می‌گرفتند و
           پهنای باند را از تصویر شاخص (عنصر LCP) می‌دزدیدند —
           روی ۳G شش ثانیه طول می‌کشید. نسخه ‎-sm حدود ۱۶KB است. -->
      <div class="cover"><img src="${coverOf(a).replace(/(\.[a-z]+)$/i, '-sm$1')}"
           alt="" loading="lazy" decoding="async"
           onerror="this.onerror=null;this.src='${coverOf(a)}'"></div>
      <div class="body">
        <div class="j-meta">
          <span>${esc(a.category_label || 'مقاله')}</span>
          <span>${a.read_time || ''}</span>
        </div>
        <div class="j-title">${esc(a.title)}</div>
        <div class="j-ex">${esc(a.excerpt || '')}</div>
        <div class="j-more">مطالعه مطلب ←</div>
      </div>
    </a>`).join('');
}

function clearSearch() {
  query = '';
  document.getElementById('jq').value = '';
  drawFeature();
  draw();
}

load();
</script>
</body>
</html>
