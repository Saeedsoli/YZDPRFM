<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#121212">
<title>پیگیری سفارش | عطر یزد</title>
<!-- فونت عمداً preload نمی‌شود.
     با font-display:swap متن بلافاصله با فونت سیستمی دیده می‌شود،
     پس preload فقط پهنای باند را از تصویر اصلی می‌دزدد. روی ۳G
     اندازه‌گیری شد: حذف آن LCP صفحه محصول را از ۴٫۳۱s به ۳٫۵۷s
     رساند بدون آنکه FCP بدتر شود. -->
<link rel="stylesheet" href="/assets/theme.css">
<style>
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:16px}
.order-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px}
.badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:.74rem;font-weight:800}
.b-paid{background:#E8F6EF;color:#1E8449}.b-pending{background:#FEF5E7;color:#B9770E}.b-cancel{background:#FDEDEC;color:#C0392B}
.oi{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--border);font-size:.84rem}
.oi:last-child{border:none}
</style></head>
<body>
<a href="#main" class="skip-link">پرش به محتوای اصلی</a>
<!-- ارتفاع هدر از پیش رزرو می‌شود. هدر با جاوااسکریپت از app.js
     ساخته می‌شود، پس تا آن لحظه ارتفاعش صفر است و با ظاهر شدن،
     کل صفحه ۹۷ تا ۱۰۳ پیکسل پایین می‌پرد. ردیابی نشان داد این
     تک‌ریشهٔ جابه‌جایی در همه صفحات بود (MAIN#main: y 0 → 97).
     اندازه‌گیری واقعی: موبایل ۹۷px · دسکتاپ ۱۰۳px. -->
<div id="hdr" class="hdr-reserve"></div>
<section class="page-head">
  <div class="inner">
    <span class="eyebrow">وضعیت مرسوله</span>
    <h1>پیگیری <em>سفارش</em></h1>
    <p>شماره موبایل و شماره سفارش را وارد کنید.</p>
  </div>
</section>

<div class="container" style="max-width:760px;margin-top:26px">
  <div class="panel focus-panel">
    <div class="field">
      <label for="m">شماره موبایل ثبت‌شده در سفارش</label>
      <!-- type=tel و inputmode=numeric صفحه‌کلید عددی موبایل را
           باز می‌کنند. بدون این، کاربر با صفحه‌کلید حروف روبه‌رو
           می‌شد و باید دستی به حالت عدد سوییچ می‌کرد.
           autocomplete=tel شماره ذخیره‌شده مرورگر را پیشنهاد می‌دهد. -->
      <input id="m" type="tel" inputmode="numeric" autocomplete="tel"
             maxlength="11" placeholder="۰۹۱۲۳۴۵۶۷۸۹" dir="ltr" style="text-align:right">
    </div>
    <div class="field">
      <label for="orderId">شماره سفارش</label>
      <input id="orderId" type="text" autocomplete="off" maxlength="80"
             placeholder="YZD-…" dir="ltr" style="text-align:right">
    </div>
    <button type="button" id="trackSearch" class="btn btn-block">مشاهده سفارش</button>
  </div>
  <div id="out"></div>
</div>
<div id="ftr"></div>
<script src="/assets/jalaali-core.js"></script>
<script src="/assets/app.js"></script>
<script src="/assets/persian-date.js"></script>
<script>
document.getElementById('hdr').innerHTML=renderHeader();
document.getElementById('ftr').innerHTML=renderFooter();
const saved=sessionStorage.getItem('yazd_last_mobile'); if(saved) document.getElementById('m').value=saved;
const savedOrder=new URLSearchParams(location.search).get('order')||sessionStorage.getItem('yazd_last_order')||'';
if (/^[A-Za-z0-9_-]{1,80}$/.test(savedOrder)) document.getElementById('orderId').value=savedOrder;
/* هر ۸ وضعیت سرور — قبلاً فقط ۳ تا شناخته می‌شد و بقیه «نامشخص» بودند */
const ST = {
  PENDING:    ['در انتظار پرداخت',   'b-pending'],
  VERIFYING:  ['در حال بررسی پرداخت', 'b-pending'],
  PAID:       ['پرداخت شده',         'b-paid'],
  PROCESSING: ['در حال آماده‌سازی',  'b-pending'],
  SHIPPED:    ['ارسال شده',          'b-pending'],
  DELIVERED:  ['تحویل داده شده',     'b-paid'],
  CANCELLED:  ['لغو شده',            'b-cancel'],
  FAILED:     ['پرداخت ناموفق',      'b-cancel'],
  RETURNED:   ['مرجوع شده',          'b-cancel'],
  EXPIRED:    ['منقضی شده',          'b-cancel']
};

const FLOW = ['PAID', 'PROCESSING', 'SHIPPED', 'DELIVERED'];
const FLOW_FA = {
  PAID:       ['سفارش ثبت شد',      'پرداخت تأیید و سفارش وارد صف شد'],
  PROCESSING: ['در حال آماده‌سازی', 'رایحه شما ساخته و بسته‌بندی می‌شود'],
  SHIPPED:    ['تحویل پست',         'مرسوله به شرکت حمل تحویل داده شد'],
  DELIVERED:  ['تحویل به شما',      'سفارش به مقصد رسید']
};
const DEAD = { CANCELLED: 'سفارش لغو شد', FAILED: 'پرداخت انجام نشد',
               RETURNED: 'سفارش مرجوع شد', EXPIRED: 'مهلت پرداخت تمام شد' };

/* خط زمانی سفارش — کاربر می‌بیند کجای مسیر است، نه فقط یک برچسب */
function timeline(status) {
  if (Object.hasOwn(DEAD,status)) {
    return `<div class="timeline">
      <div class="tl-step done"><div class="t">سفارش ثبت شد</div></div>
      <div class="tl-step cancel"><div class="t">${esc(DEAD[status])}</div>
        <div class="d">برای پیگیری با پشتیبانی تماس بگیرید.</div></div>
    </div>`;
  }
  const idx = FLOW.indexOf(status);
  if (idx < 0) return '';
  const pct = FLOW.length > 1 ? (idx / (FLOW.length - 1)) * 100 : 0;
  return `<div class="timeline">
    <div class="fill" style="height:calc(${pct}% - 0px)"></div>
    ${FLOW.map((st, i) => {
      const cls = i < idx ? 'done' : i === idx ? 'now done' : '';
      const [t, d] = FLOW_FA[st];
      return `<div class="tl-step ${cls}">
        <div class="t">${t}</div>
        ${i === idx ? `<div class="d">${d}</div>` : ''}
      </div>`;
    }).join('')}
  </div>`;
}

function copyCode(el, code) {
  if (!navigator.clipboard || typeof navigator.clipboard.writeText !== 'function') {
    toast('کپی خودکار در این مرورگر در دسترس نیست.');return;
  }
  navigator.clipboard.writeText(code).then(() => {
    const old = el.textContent;
    el.textContent = 'کپی شد ✓';
    setTimeout(() => { el.textContent = old; }, 1800);
  }).catch(() => { toast('کپی انجام نشد؛ کد را دستی انتخاب کنید.'); });
}

async function track() {
  const btn = document.getElementById('trackSearch');
  if (btn.disabled) return;
  let m = document.getElementById('m').value
    .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
    .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
    .replace(/[\s\-‌]/g, '');
  if (!/^09\d{9}$/.test(m)) return toast('شماره موبایل معتبر وارد کنید');
  const oid=document.getElementById('orderId').value.replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).trim().toUpperCase();
  if (!/^[A-Z0-9_-]{1,80}$/.test(oid)) return toast('شماره سفارش معتبر وارد کنید');

  btn.disabled = true; btn.textContent = 'در حال جستجو…';
  const o = document.getElementById('out');

  let d;
  try {
    const r = await fetch('/api/orders/track', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mobile:m,order_id:oid})});
    d = await r.json();
    if (!r.ok) throw new Error(d.error || 'پیگیری موقتاً در دسترس نیست.');
  } catch (e) {
    o.innerHTML = `<div class="empty-state soft-card"><h3>امکان پیگیری نیست</h3>
      <p style="margin-top:6px"></p></div>`;
    o.querySelector('p').textContent = e instanceof TypeError ? 'اتصال اینترنت را بررسی کنید.' : (e.message || 'کمی بعد دوباره تلاش کنید.');
    btn.disabled = false; btn.textContent = 'مشاهده سفارش';
    return;
  }
  btn.disabled = false; btn.textContent = 'مشاهده سفارش';

  if (!d.orders.length) {
    o.innerHTML = `<div class="empty-state soft-card" style="padding:44px 24px">
      <h3>سفارشی با این مشخصات پیدا نشد</h3>
      <p style="margin-top:8px;font-size:.87rem;color:var(--muted);line-height:2">
        شماره موبایل و شماره سفارش را بررسی کنید.</p>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px">
        <a href="/contact" class="btn btn-outline">تماس با پشتیبانی</a>
      </div></div>`;
    return;
  }

  o.innerHTML = d.orders.map(x => {
    const st = Object.hasOwn(ST,x.status) ? ST[x.status] : ['نامشخص', 'b-pending'];
    const paidLike = ['PAID','PROCESSING','SHIPPED','DELIVERED'].includes(x.status);
    return `<div class="order-card soft-card">
      <div style="display:flex;justify-content:space-between;align-items:center;
                  margin-bottom:6px;flex-wrap:wrap;gap:8px">
        <strong dir="ltr" style="font-size:.95rem;overflow-wrap:anywhere">${esc(x.order_id)}</strong>
        <span class="badge ${st[1]}">${st[0]}</span>
      </div>
      <div style="font-size:.79rem;color:var(--muted)">
        ${esc(YazdDate.formatDate(x.created_at))}
      </div>

      ${timeline(x.status)}

      ${x.tracking_code ? `<div class="track-box">
        <div><div style="font-size:.72rem;color:var(--muted)">کد رهگیری ${esc(x.carrier || 'پستی')}</div>
          <div class="code">${esc(x.tracking_code)}</div></div>
        <button type="button" data-track-copy data-code="${esc(x.tracking_code)}">کپی کد</button>
      </div>` : ''}

      ${x.items.map(i => `<div class="oi"><span>${esc(i.product_name)}</span>
        <span style="white-space:nowrap">${esc(toFa(i.quantity))} × ${money(i.unit_price)}</span></div>`).join('')}
      <div class="oi" style="font-weight:800;padding-top:10px">
        <span>مبلغ کل</span><span>${money(x.total_paid)} تومان</span></div>

      ${paidLike ? `<div style="margin-top:11px">
        <a href="/invoice.html?order=${encodeURIComponent(x.order_id)}" target="_blank"
           style="font-size:.79rem;color:var(--gold);font-weight:700">مشاهده فاکتور ←</a>
      </div>` : ''}
    </div>`;
  }).join('');
}

document.getElementById('trackSearch').addEventListener('click', track);
for (const id of ['m','orderId']) document.getElementById(id).addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault();track();}
});
document.getElementById('out').addEventListener('click',e=>{
  const button=e.target.closest('[data-track-copy]');
  if(button)copyCode(button,button.dataset.code);
});

if(saved && savedOrder && /^[A-Za-z0-9_-]{1,80}$/.test(savedOrder)) track();
</script></body></html>
