     با font-display:swap متن بلافاصله با فونت سیستمی دیده می‌شود،
     پس preload فقط پهنای باند را از تصویر اصلی می‌دزدد. روی ۳G
     اندازه‌گیری شد: حذف آن LCP صفحه محصول را از ۴٫۳۱s به ۳٫۵۷s
     رساند بدون آنکه FCP بدتر شود. -->
<link rel="stylesheet" href="/assets/theme.css">
  <style>
    body { background: #0A0A0A; color: #FFF; min-height: 100dvh;
           display: flex; flex-direction: column }
    .quiz-stage { flex: 1; display: flex; align-items: center; justify-content: center;
                  padding: 20px 0; position: relative; overflow: hidden }
    /* هاله آرام پس‌زمینه — همان زبان بصری بقیه سایت */
    .quiz-stage::before {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 55% 45% at 50% 28%, rgba(197,155,39,.13), transparent 70%);
      animation: haloBreath 12s ease-in-out infinite;
    }
    .quiz-container { position: relative; z-index: 2; width: 100%; max-width: 540px; margin: 20px }

    /* ── نوار پیشرفت با شماره ── */
    .quiz-head { display: flex; align-items: center; justify-content: space-between;
                 gap: 14px; margin-bottom: 18px }
    .quiz-progress { display: flex; gap: 7px; flex: 1 }
    .quiz-step-dot { flex: 1; height: 4px; border-radius: 3px;
      background: rgba(255,255,255,.14); transition: background 420ms var(--ease-out) }
    .quiz-step-dot.done { background: rgba(197,155,39,.55) }
    .quiz-step-dot.active { background: var(--gold); box-shadow: 0 0 12px rgba(197,155,39,.6) }
    .quiz-count { font-size: .74rem; color: rgba(255,255,255,.42);
                  font-weight: 700; white-space: nowrap; letter-spacing: .5px }

    /* ── کارت ── */
    .quiz-card {
      background: rgba(255,255,255,.045); backdrop-filter: blur(14px);
      border: 1px solid rgba(197,155,39,.26); border-radius: var(--r-lg);
      padding: 30px 24px; min-height: 400px;
      display: flex; flex-direction: column; justify-content: center;
    }
    .quiz-question { font-size: 1.26rem; font-weight: 800; margin-bottom: 7px;
                     line-height: 1.55; text-align: center }
    .quiz-subtitle { font-size: .82rem; color: rgba(255,255,255,.48);
                     margin-bottom: 22px; text-align: center; line-height: 1.9 }

    /* ── گزینه‌ها: آیکون SVG، نه ایموجی ── */
    .quiz-options { display: flex; flex-direction: column; gap: 9px }
    .quiz-option {
      display: flex; align-items: center; gap: 13px; text-align: right;
      background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1);
      padding: 14px 17px; border-radius: 13px; cursor: pointer;
      font-family: var(--font); color: #FFF; width: 100%;
      position: relative; overflow: hidden;
      animation: optIn 460ms var(--ease-out) backwards;
      transition: background 200ms var(--ease-out), border-color 200ms var(--ease-out),
                  transform 200ms var(--ease-out);
    }
    .quiz-option:nth-child(1){animation-delay:40ms} .quiz-option:nth-child(2){animation-delay:90ms}
    .quiz-option:nth-child(3){animation-delay:140ms} .quiz-option:nth-child(4){animation-delay:190ms}
    .quiz-option:nth-child(5){animation-delay:240ms} .quiz-option:nth-child(6){animation-delay:290ms}
    @keyframes optIn { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
    .quiz-option::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,.13) 50%, transparent 70%);
      transform: translateX(-120%); transition: transform 620ms var(--ease-soft);
    }
    .quiz-option:hover::before { transform: translateX(120%) }
    .quiz-option:hover { background: rgba(197,155,39,.14);
      border-color: rgba(197,155,39,.5); transform: translateY(-2px) }
    .quiz-option .ic {
      flex: none; width: 38px; height: 38px; border-radius: 11px;
      background: rgba(197,155,39,.12); border: 1px solid rgba(197,155,39,.28);
      display: grid; place-items: center; transition: all 200ms var(--ease-out);
    }
    .quiz-option .ic svg { width: 19px; height: 19px; stroke: var(--gold);
                           fill: none; stroke-width: 1.7 }
    .quiz-option .tx { flex: 1; min-width: 0 }
    .quiz-option .lb { font-size: .94rem; font-weight: 700; line-height: 1.5 }
    .quiz-option .ds { font-size: .73rem; opacity: .55; margin-top: 2px; line-height: 1.7 }
    .quiz-option.selected {
      background: var(--gold); color: #121212; border-color: var(--gold);
      animation: pickBounce 360ms var(--ease-spring);
    }
    .quiz-option.selected .ds { opacity: .7 }
    .quiz-option.selected .ic { background: rgba(18,18,18,.14); border-color: rgba(18,18,18,.24) }
    .quiz-option.selected .ic svg { stroke: #121212 }
    @keyframes pickBounce { 0%{transform:scale(.97)} 55%{transform:scale(1.025)} 100%{transform:scale(1)} }

    /* ── دکمه بازگشت به سؤال قبل ── */
    .quiz-nav { display: flex; justify-content: center; margin-top: 18px }
    .back-q {
      display: inline-flex; align-items: center; gap: 6px;
      background: none; border: none; cursor: pointer; font-family: var(--font);
      color: rgba(255,255,255,.45); font-size: .8rem; font-weight: 600;
      transition: color var(--t-fast);
    }
    .back-q:hover { color: var(--gold) }
    .back-q svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2 }
    .back-q[hidden] { display: none }

    /* ── نتایج ── */
    .res-top { text-align: center; margin-bottom: 18px }
    .res-top .k { font-size: .7rem; letter-spacing: 2.2px; color: var(--gold);
                  font-weight: 700; margin-bottom: 8px }
    .res-top h2 { font-size: 1.2rem; font-weight: 800; line-height: 1.5 }
    .res-top p { font-size: .8rem; color: rgba(255,255,255,.46); margin-top: 6px; line-height: 1.9 }

    .quiz-result-card {
      background: rgba(255,255,255,.055); border: 1px solid rgba(197,155,39,.22);
      border-radius: 13px; padding: 14px; margin-bottom: 10px; text-align: right;
      display: flex; gap: 12px; align-items: center; text-decoration: none; color: inherit;
      animation: fadeUp 520ms var(--ease-out) backwards;
      transition: border-color var(--t-fast), transform var(--t-fast), background var(--t-fast);
    }
    .quiz-result-card:hover { border-color: rgba(197,155,39,.6);
      background: rgba(197,155,39,.07); transform: translateX(-4px) }
    .quiz-result-rank {
      flex: none; width: 30px; height: 30px; border-radius: 50%;
      display: grid; place-items: center; font-size: .84rem; font-weight: 800;
      background: rgba(197,155,39,.16); color: var(--gold);
      border: 1px solid rgba(197,155,39,.35);
    }
    .quiz-result-card:first-of-type .quiz-result-rank {
      background: var(--gold); color: #121212; border-color: var(--gold);
    }
    .quiz-result-card img { width: 54px; height: 54px; object-fit: cover;
                            border-radius: 10px; flex-shrink: 0 }
    .quiz-result-info { flex: 1; min-width: 0 }
    .quiz-result-name { font-weight: 800; font-size: .92rem; line-height: 1.5 }
    .quiz-result-brand { font-size: .74rem; color: var(--gold); margin-top: 2px; direction: ltr; text-align: right }
    .quiz-result-notes { font-size: .71rem; color: rgba(255,255,255,.5); margin-top: 3px }
    .quiz-result-price { font-weight: 800; font-size: .83rem; margin-top: 4px }

    /* نوار تطابق — چقدر با سلیقه شما جور است */
    .fitbar { height: 3px; border-radius: 2px; background: rgba(255,255,255,.1);
              margin-top: 7px; overflow: hidden }
    .fitbar i { display: block; height: 100%; background: var(--gold);
                transform-origin: right; animation: barGrow 900ms var(--ease-out) backwards }
    @keyframes barGrow { from { transform: scaleX(0) } to { transform: scaleX(1) } }

    .btn-primary { background: var(--gold); color: #121212; padding: 14px 32px;
      border-radius: 30px; font-weight: 800; font-size: .9rem; border: none;
      cursor: pointer; font-family: var(--font); width: 100%; margin-top: 18px;
      transition: transform var(--t-fast), box-shadow var(--t-fast) }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(197,155,39,.32) }
    .btn-secondary { background: transparent; color: #FFF; padding: 12px 24px;
      border-radius: 30px; font-weight: 600; font-size: .85rem;
      border: 1px solid rgba(255,255,255,.22); cursor: pointer;
      font-family: var(--font); margin-top: 8px; width: 100%;
      transition: border-color var(--t-fast) }
    .btn-secondary:hover { border-color: var(--gold) }

    .quiz-back-link { text-align: center; margin-top: 22px }
    .quiz-back-link a { color: rgba(255,255,255,.45); font-size: .82rem;
                        text-decoration: none; transition: color var(--t-fast) }
    .quiz-back-link a:hover { color: var(--gold) }

    .hidden { display: none !important }
    @keyframes spin { to { transform: rotate(360deg) } }
    .animate-in { animation: fadeUp 400ms var(--ease-out) }
  </style>
</head>

       ولی بدون h1، صفحه‌خوان نمی‌تواند بگوید کاربر کجاست. -->

// ═══ Load quiz data ═══
async function loadQuizData() {
  try {
    const resp = await fetch('/api/health');
    if (resp.ok) { const h = await resp.json(); quizProducts = { length: h.products }; return true; }
  } catch(e) {}
  return true;
}

// ═══ Render ═══
function renderProgress(done) {
  const container = document.getElementById('quizProgress');
  container.innerHTML = '';
  for (let i = 0; i < TOTAL_STEPS; i++) {
    const dot = document.createElement('div');
    dot.className = 'quiz-step-dot';
    if (done || i < currentStep) dot.classList.add('done');
    if (!done && i === currentStep) dot.classList.add('active');
    container.appendChild(dot);
  }
  document.getElementById('quizCount').textContent =
    done ? 'نتیجه' : `${faNum(currentStep + 1)} از ${faNum(TOTAL_STEPS)}`;
  // دکمه بازگشت تنها وقتی جایی برای برگشتن هست
  document.getElementById('backBtn').hidden = done || currentStep === 0;
}

/* بازگشت به سؤال قبل — کاربر باید بتواند نظرش را عوض کند */
function goBack() {
  if (currentStep === 0) return;
  currentStep--;
  renderProgress();
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentStep];
  const card = document.getElementById('quizCard');
  card.className = 'quiz-card animate-in';

  // اگر کاربر برگشته، انتخاب قبلی‌اش را نشان بده
  const prev = answers[q.id];

  const optionsHTML = q.options.map(opt => `
    <button type="button" class="quiz-option${prev === opt.value ? ' selected' : ''}"
            data-value="${opt.value}" onclick="selectOption('${q.id}', '${opt.value}', this)">
      <span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true">${IC[opt.icon] || IC.any}</svg></span>
      <span class="tx">
        <span class="lb">${opt.label}</span>
        <span class="ds">${opt.desc}</span>
      </span>
    </button>`).join('');

  card.innerHTML = `
    <div class="quiz-question">${q.title}</div>
    <div class="quiz-subtitle">${q.subtitle}</div>
    <div class="quiz-options">${optionsHTML}</div>`;
}

function selectOption(qid, value, el) {
  // Highlight
  document.querySelectorAll('.quiz-option').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  answers[qid] = value;
  
  // Auto-advance after short delay
  setTimeout(() => {
    if (currentStep < TOTAL_STEPS - 1) {
      currentStep++;
      renderProgress();
      renderQuestion();
    } else {
      renderProgress(true);
      runQuiz();
    }
  }, 340);
}

async function runQuiz() {
  const card = document.getElementById('quizCard');
  card.innerHTML = `<div style="text-align:center;padding:30px">
    <div style="width:34px;height:34px;border:3px solid var(--gold);border-top-color:transparent;
      border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px"></div>
    <p>در حال تحلیل سلیقه بویایی شما…</p></div>`;

  try {
    const r = await fetch('/api/quiz', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ answers })
    });
    const d = await r.json();
    results = d.results || [];
    if (d.total_products) quizProducts = { length: d.total_products };

    /* ذخیره پروفایل بویایی.
       سرور برای کاربر واردشده خودش ذخیره می‌کند؛ این نسخه محلی
       برای مهمان است — که اکثریت بازدیدکنندگان‌اند. از این پس
       صفحه اصلی «پیشنهاد برای شما» نشان می‌دهد. */
    if (typeof YazdTaste !== 'undefined' && d.profile &&
        Object.keys(d.profile).length >= 2) {
      YazdTaste.save(d.profile);
    }
  } catch { results = []; }
  renderResults();
}

function renderResults() {
  const card = document.getElementById('quizCard');
  card.className = 'quiz-card animate-in';
  
  if (results.length === 0) {
    card.innerHTML = `
      <div class="res-top">
        <div class="k">نتیجه‌ای نبود</div>
        <h2>ترکیب سلیقه شما خیلی خاص بود</h2>
        <p>با پاسخ‌های بازتر — مثلاً «فرقی نمی‌کند» — دوباره امتحان کنید،<br>
           یا مستقیم سراغ کاتالوگ بروید.</p>
      </div>
      <button class="btn-primary" onclick="resetQuiz()">شروع دوباره کوییز</button>
      <button class="btn-secondary" onclick="location.href='/'">مشاهده کاتالوگ کامل</button>`;
    return;
  }

  // بیشترین امتیاز مبنای درصد تطابق است
  const best = Math.max(...results.map(r => r._score || 0), 1);
  
  /* نشان جنسیت کنار نُت‌ها — کاربر باید ببیند پیشنهاد مردانه است
     یا زنانه، بدون اینکه لازم باشد صفحه محصول را باز کند. */
  const gLabel = g => g === 'MEN' ? '<b style="color:var(--gold)">مردانه</b> · '
                    : g === 'WOMEN' ? '<b style="color:var(--gold)">زنانه</b> · '
                    : g === 'UNISEX' ? '<b style="color:var(--gold)">یونیسکس</b> · ' : '';

  const resultsHTML = results.map((p, i) => {
    const notesStr = (p.notes_top || []).slice(0, 3).join('، ');
    const full = p.brand_fa ? `${p.brand_fa} — ${p.name_fa}` : p.name_fa;
    const priceStr = p.min_price ? faNum(p.min_price.toLocaleString('en-US')) + ' تومان' : '';
    const fit = Math.round(((p._score || 0) / best) * 100);
    return `
      <a class="quiz-result-card" href="/perfume/${encodeURIComponent(p.slug)}" style="animation-delay:${i * 80}ms">
        <div class="quiz-result-rank">${faNum(i + 1)}</div>
        ${p.image_url ? `<img src="${esc(cardImage(p.image_url))}" alt="${isGenericProductImage(p.image_url) ? 'تصویر نمادین' : ''}" loading="lazy">` : ''}
        <div class="quiz-result-info">
          <div class="quiz-result-name">${esc(full)}
            <span style="font-size:.7rem;color:var(--gold)">«دست‌ساز»</span></div>
          <div class="quiz-result-brand">${esc(p.name_en || '')}</div>
          ${isGenericProductImage(p.image_url) ? '<div class="quiz-result-notes">تصویر نمادین است</div>' : ''}
          ${notesStr ? `<div class="quiz-result-notes">${gLabel(p.gender)}${esc(notesStr)}</div>` : ''}
          ${priceStr ? `<div class="quiz-result-price">از ${esc(priceStr)}</div>` : ''}
          <div class="fitbar" title="میزان تطابق با سلیقه شما">
            <i style="width:${fit}%;animation-delay:${i * 80 + 200}ms"></i></div>
        </div>
      </a>`;
  }).join('');

  // خلاصه پاسخ‌ها — کاربر ببیند بر چه اساسی انتخاب شده
  const chosen = questions
    .map(q => {
      const v = answers[q.id];
      if (!v || v === 'ANY') return null;
      const o = q.options.find(x => x.value === v);
      return o ? o.label : null;
    })
    .filter(Boolean);

  card.innerHTML = `
    <div class="res-top">
      <div class="k">پیشنهاد اختصاصی</div>
      <h2>این رایحه‌ها به سلیقه شما نزدیک‌اند</h2>
      <p>از میان ${faNum(quizProducts.length || 2111)} رایحه انتخاب شد
      ${chosen.length ? `<br><span style="color:rgba(197,155,39,.8)">${chosen.join(' · ')}</span>` : ''}</p>
    </div>
    ${resultsHTML}
    <button class="btn-primary" onclick="resetQuiz()">شروع دوباره کوییز</button>
    <button class="btn-secondary" onclick="location.href='/'">مشاهده کاتالوگ کامل</button>`;
}

function faNum(n) { return String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]); }

function resetQuiz() {
  currentStep = 0;
  answers = {};
  results = [];
  renderProgress();
  renderQuestion();
  document.getElementById('quizCard').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// ═══ Init ═══
async function init() {
  const loaded = await loadQuizData();
  if (!loaded) {
    document.getElementById('quizCard').innerHTML = `
      <div class="res-top"><h2>ارتباط برقرار نشد</h2>
      <p>اتصال اینترنت خود را بررسی کنید و دوباره تلاش کنید.</p></div>
      <button class="btn-primary" onclick="location.reload()">تلاش دوباره</button>`;
    return;
  }
  renderProgress();
  renderQuestion();
}

init();
</script>
</body>
</html>
